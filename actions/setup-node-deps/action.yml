name: 'Setup Node Dependencies'
description: 'Install Node.js dependencies with caching and package manager detection'

inputs:
  node-version:
    description: 'Node.js version'
    required: true
    default: '20'
  package-manager:
    description: 'Package manager: npm, pnpm, or yarn'
    required: true
    default: 'npm'
  registry-url:
    description: 'npm registry URL (set to enable auth)'
    required: false
    default: ''
  scope:
    description: 'npm scope (used with registry-url)'
    required: false
    default: ''
  script:
    description: 'package.json script name to run after install'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Validate package manager
      shell: bash
      env:
        PKG_MGR: ${{ inputs.package-manager }}
      run: |
        case "$PKG_MGR" in
          npm|pnpm|yarn) ;;
          *) echo "ERROR: invalid package manager: $PKG_MGR" >&2; exit 1 ;;
        esac

    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.package-manager }}
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}

    - name: Install pnpm
      if: ${{ inputs.package-manager == 'pnpm' }}
      shell: bash
      run: npm install -g pnpm

    - name: Install dependencies (npm)
      if: ${{ inputs.package-manager == 'npm' }}
      shell: bash
      run: |
        if [ -f "package-lock.json" ]; then
          npm ci
        else
          npm install
        fi

    - name: Install dependencies (pnpm)
      if: ${{ inputs.package-manager == 'pnpm' }}
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Install dependencies (yarn)
      if: ${{ inputs.package-manager == 'yarn' }}
      shell: bash
      run: yarn install --frozen-lockfile

    - name: Run script
      if: ${{ inputs.script != '' }}
      shell: bash
      env:
        PKG_MGR: ${{ inputs.package-manager }}
        SCRIPT: ${{ inputs.script }}
      run: |
        case "$PKG_MGR" in
          npm|pnpm|yarn) ;;
          *) echo "ERROR: invalid package manager: $PKG_MGR" >&2; exit 1 ;;
        esac
        "$PKG_MGR" run "$SCRIPT"
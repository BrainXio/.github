name: 'Common Setup'
description: 'Checkout repository and setup language toolchain in one step'

inputs:
  language:
    description: 'Language: python, node, go, rust'
    required: true
  version:
    description: 'Language version (python-version, node-version, go-version, or rust toolchain)'
    required: true
  extra-deps:
    description: 'Extra uv dependency groups (python only)'
    required: false
    default: ''
  package-manager:
    description: 'Package manager: npm, pnpm, or yarn (node only)'
    required: false
    default: 'npm'
  registry-url:
    description: 'npm registry URL (node only)'
    required: false
    default: ''
  scope:
    description: 'npm scope (node only)'
    required: false
    default: ''
  toolchain:
    description: 'Rust toolchain (rust only, falls back to version)'
    required: false
    default: ''
  components:
    description: 'Comma-separated rust components (rust only)'
    required: false
    default: 'clippy,rustfmt'

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        persist-credentials: false

    - uses: brainxio/.github/actions/setup-python-deps@v1
      if: ${{ inputs.language == 'python' }}
      with:
        python-version: ${{ inputs.version }}
        extra-deps: ${{ inputs.extra-deps }}

    - uses: brainxio/.github/actions/setup-node-deps@v1
      if: ${{ inputs.language == 'node' }}
      with:
        node-version: ${{ inputs.version }}
        package-manager: ${{ inputs.package-manager }}
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}

    - uses: brainxio/.github/actions/setup-go-deps@v1
      if: ${{ inputs.language == 'go' }}
      with:
        go-version: ${{ inputs.version }}

    - uses: brainxio/.github/actions/setup-rust-deps@v1
      if: ${{ inputs.language == 'rust' }}
      with:
        toolchain: ${{ inputs.toolchain || inputs.version }}
        components: ${{ inputs.components }}

name: Self CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Node 20→24 migration, remove Q3 2026

permissions:
  contents: read

jobs:
  validate-workflows:
    name: Validate Workflow Syntax
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true

      - name: Sync dependencies
        if: hashFiles('pyproject.toml') != ''
        run: uv sync

      - name: Install PyYAML
        shell: bash
        run: pip install pyyaml 2>/dev/null || python3 -m pip install pyyaml

      - name: YAML syntax check
        shell: bash
        run: |
          python3 -c "
          import sys, yaml, glob
          errors = []
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              if 'self-ci.yml' in f:
                  continue
              try:
                  with open(f) as fh:
                      yaml.safe_load(fh)
              except Exception as e:
                  errors.append(f'{f}: {e}')
          if errors:
              for e in errors:
                  print(f'FAIL: {e}', file=sys.stderr)
              sys.exit(1)
          print('All workflow files valid')
          "

      - name: Enforce absolute action references (no relative paths)
        run: |
          ! grep -rE 'uses: \./\.github/actions/' workflows/ .github/workflows/ || \
          (echo "FAIL: Relative ./ .github/actions/ paths found in consumer workflows" && exit 1)

      - name: Enforce no deprecated actions/cache@v[0-3]
        run: |
          ! grep -rE 'actions/cache@v[0-3]' . || \
          (echo "FAIL: Deprecated actions/cache@v[0-3] detected — must use @v4" && exit 1)

  test-ci-python-synthetic:
    name: Synthetic Python CI Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Create synthetic Python project
        shell: bash
        run: |
          mkdir -p /tmp/test-project/src/test_pkg
          mkdir -p /tmp/test-project/tests

          cat > /tmp/test-project/pyproject.toml << 'PYEOF'
          [build-system]
          requires = ["hatchling"]
          build-backend = "hatchling.build"

          [project]
          name = "test-project"
          version = "0.1.0"
          requires-python = ">=3.10"
          dependencies = ["pytest", "pytest-cov", "ruff", "mypy", "build"]

          [tool.hatch.build.targets.wheel]
          packages = ["src/test_pkg"]
          PYEOF

          cat > /tmp/test-project/src/test_pkg/__init__.py << 'PYEOF'
          """Test package."""
          __version__ = "0.1.0"
          PYEOF

          cat > /tmp/test-project/src/test_pkg/main.py << 'PYEOF'
          def greet(name: str) -> str:
              return f"Hello, {name}"
          PYEOF

          cat > /tmp/test-project/tests/test_main.py << 'PYEOF'
          from test_pkg.main import greet

          def test_greet():
              assert greet("world") == "Hello, world"
          PYEOF

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Run lint on synthetic project
        working-directory: /tmp/test-project
        shell: bash
        run: |
          uv sync
          uv run ruff format src/ tests/  # format generated files so --check passes
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/

      - name: Run type check on synthetic project
        working-directory: /tmp/test-project
        shell: bash
        run: uv run mypy src/test_pkg --strict

      - name: Run tests on synthetic project
        working-directory: /tmp/test-project
        shell: bash
        run: uv run pytest --cov --cov-report=term-missing -q

      - name: Build wheel
        working-directory: /tmp/test-project
        shell: bash
        run: uv run python -m build

      - name: Verify wheel entry points
        working-directory: /tmp/test-project
        shell: bash
        env:
          ENTRY_POINTS: "test_pkg"
        run: |
          python3 -c "
          import glob, os, sys, zipfile

          entry_points = os.environ['ENTRY_POINTS'].split()
          if not entry_points:
              print('ERROR: no entry point names provided')
              sys.exit(1)

          wheel_dir = 'dist'
          wheels = sorted(glob.glob(os.path.join(wheel_dir, '*.whl')))
          if not wheels:
              print(f'ERROR: no .whl found in {wheel_dir}/')
              sys.exit(1)

          wheel = wheels[-1]
          with zipfile.ZipFile(wheel) as z:
              names = z.namelist()

          missing = [ep for ep in entry_points
                     if not any(ep in name for name in names)]
          if missing:
              print(f'ERROR: missing from {wheel}: {missing}')
              sys.exit(1)

          print(f'Verified {len(entry_points)} entry point(s) in {os.path.basename(wheel)}')
          "

  test-ci-typescript-synthetic:
    name: Synthetic TypeScript CI Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Create synthetic TypeScript project
        run: |
          mkdir -p /tmp/test-project-ts/src
          mkdir -p /tmp/test-project-ts/tests

          cat > /tmp/test-project-ts/package.json << 'EOF'
          {
            "name": "test-project-typescript",
            "version": "0.1.0",
            "type": "commonjs",
            "scripts": {
              "lint": "echo 'lint: success'",
              "format:check": "echo 'format:check: success'",
              "typecheck": "tsc --noEmit",
              "test": "echo 'test: success'"
            },
            "devDependencies": {
              "typescript": "^5.0.0",
              "@types/node": "^20.0.0",
              "ts-node": "^10.9.0"
            }
          }
          EOF

          cat > /tmp/test-project-ts/tsconfig.json << 'EOF'
          {
            "compilerOptions": {
              "target": "ES2020",
              "module": "commonjs",
              "strict": true,
              "esModuleInterop": true,
              "skipLibCheck": true,
              "forceConsistentCasingInFileNames": true
            },
            "include": ["src", "tests"]
          }
          EOF

          cat > /tmp/test-project-ts/src/index.ts << 'EOF'
          export const hello = (name: string): string => "Hello, " + name;
          EOF

          cat > /tmp/test-project-ts/tests/test.ts << 'EOF'
          import { hello } from "../src/index";

          describe("hello", () => {
            it("returns greeting", () => {
              const result = hello("world");
              if (result !== "Hello, world") {
                throw new Error("expected 'Hello, world'");
              }
            });
          });
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: /tmp/test-project-ts
        shell: bash
        run: npm ci

      - name: Run lint
        working-directory: /tmp/test-project-ts
        shell: bash
        run: npm run lint

      - name: Run format check
        working-directory: /tmp/test-project-ts
        shell: bash
        run: npm run format:check

      - name: Run typecheck
        working-directory: /tmp/test-project-ts
        shell: bash
        run: npm run typecheck

      - name: Run tests
        working-directory: /tmp/test-project-ts
        shell: bash
        run: npm test

      - name: Verify npm cache on second run
        working-directory: /tmp/test-project-ts
        shell: bash
        run: |
          # Second npm ci should hit cache (no "added N packages" output)
          output=$(npm ci 2>&1)
          if echo "$output" | grep -q "added"; then
            echo "WARN: second npm ci did not appear to hit cache:"
            echo "$output"
          else
            echo "Cache verified: second run did not reinstall packages"
          fi

  test-ci-go-synthetic:
    name: Synthetic Go CI Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Create synthetic Go project
        shell: bash
        run: |
          mkdir -p /tmp/test-project-go

          cat > /tmp/test-project-go/go.mod << 'EOF'
          module test-project

          go 1.22
          EOF

          cat > /tmp/test-project-go/main.go << 'EOF'
          package main

          import "fmt"

          func main() {
              fmt.Println(hello())
          }

          func hello() string {
              return "hello"
          }
          EOF

          cat > /tmp/test-project-go/main_test.go << 'EOF'
          package main

          import "testing"

          func TestHello(t *testing.T) {
              if hello() != "hello" {
                  t.Error("expected hello")
              }
          }
          EOF

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22"

      - name: Run gofmt check
        working-directory: /tmp/test-project-go
        shell: bash
        run: |
          output=$(gofmt -d .)
          if [ -n "$output" ]; then
            echo "ERROR: gofmt found unformatted files:"
            echo "$output"
            exit 1
          fi
          echo "gofmt: no issues"

      - name: Run go vet
        working-directory: /tmp/test-project-go
        shell: bash
        run: go vet ./...

      - name: Run tests with race detector
        working-directory: /tmp/test-project-go
        shell: bash
        run: go test -race -coverprofile=coverage.out ./...

      - name: Run go build
        working-directory: /tmp/test-project-go
        shell: bash
        run: go build ./...

      - name: Verify go build cache on second run
        working-directory: /tmp/test-project-go
        shell: bash
        run: |
          # Second go build should be cached
          output=$(go build ./... 2>&1)
          if [ -n "$output" ]; then
            echo "WARN: second go build produced output (cache may not be working): $output"
          else
            echo "Cache verified: second go build was instant"
          fi

  test-ci-rust-synthetic:
    name: Synthetic Rust CI Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Create synthetic Rust project
        run: |
          mkdir -p /tmp/test-project-rust/src

          cat > /tmp/test-project-rust/Cargo.toml << 'EOF'
          [package]
          name = "test-project-rust"
          version = "0.1.0"
          edition = "2021"

          [lib]
          name = "test_project_rust"
          path = "src/lib.rs"
          EOF

          cat > /tmp/test-project-rust/src/lib.rs << 'EOF'
          pub fn add(a: i32, b: i32) -> i32 {
              a + b
          }
          EOF

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: "1.87.0"
          components: clippy, rustfmt

      - name: Run cargo fmt check
        working-directory: /tmp/test-project-rust
        shell: bash
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        working-directory: /tmp/test-project-rust
        shell: bash
        run: cargo clippy --all-targets -- -D warnings

      - name: Run cargo test
        working-directory: /tmp/test-project-rust
        shell: bash
        run: cargo test

      - name: Run cargo build release
        working-directory: /tmp/test-project-rust
        shell: bash
        run: cargo build --release

      - name: Verify cargo build cache on second run
        working-directory: /tmp/test-project-rust
        shell: bash
        run: |
          # Second cargo build should be cached
          output=$(cargo build --release 2>&1)
          if echo "$output" | grep -q "Compiling"; then
            echo "WARN: second cargo build recompiled (cache may not be working)"
          else
            echo "Cache verified: second cargo build was instant"
          fi

  consumer-simulation:
    name: Consumer Repo Simulation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install actionlint and zizmor
        shell: bash
        run: |
          # actionlint — shellcheck-based GitHub Actions linter
          go install github.com/rhysd/actionlint/cmd/actionlint@latest 2>/dev/null \
            && echo "actionlint installed" \
            || { echo "WARN: actionlint install failed, will fall back to manual check"; }
          # zizmor — GitHub Actions security linter (Rust-based, install via cargo)
          cargo install zizmor 2>/dev/null \
            && echo "zizmor installed" \
            || { echo "WARN: zizmor install failed, will fall back to manual check"; }

      - name: Create Python consumer project
        shell: bash
        env:
          CONSUMER_ROOT: /tmp/consumer-python
        run: |
          # -----------------------------------------------------------------
          # Build a minimal consumer repo structure that calls the workflows
          # exactly as an external repo would — via relative `uses:` paths.
          # -----------------------------------------------------------------
          ROOT="$CONSUMER_ROOT"
          mkdir -p "$ROOT/src/consumer_pkg"
          mkdir -p "$ROOT/tests"
          mkdir -p "$ROOT/.github/workflows"
          mkdir -p "$ROOT/.github/actions/setup-python-deps"

          # ── pyproject.toml ─────────────────────────────────────────────
          cat > "$ROOT/pyproject.toml" << 'PYEOF'
          [build-system]
          requires = ["hatchling"]
          build-backend = "hatchling.build"

          [project]
          name = "consumer-pkg"
          version = "0.1.0"
          requires-python = ">=3.10"
          dependencies = ["pytest", "pytest-cov", "ruff", "mypy", "build"]

          [tool.hatch.build.targets.wheel]
          packages = ["src/consumer_pkg"]
          PYEOF

          # ── src/consumer_pkg/__init__.py ─────────────────────────────────
          cat > "$ROOT/src/consumer_pkg/__init__.py" << 'PYEOF'
          """Consumer package for workflow simulation."""
          __version__ = "0.1.0"

          def greet(name: str) -> str:
              return f"Hello, {name}"
          PYEOF

          # ── tests/test_consumer.py ─────────────────────────────────────
          cat > "$ROOT/tests/test_consumer.py" << 'PYEOF'
          from consumer_pkg import greet

          def test_greet():
              assert greet("world") == "Hello, world"
          PYEOF

          # ── Copy reusable workflow + action ───────────────────────────
          cp .github/workflows/ci-python.yml "$ROOT/.github/workflows/ci-python.yml"
          cp .github/actions/setup-python-deps/action.yml \
             "$ROOT/.github/actions/setup-python-deps/action.yml"

          # ── Consumer ci.yml — calls ./ workflows exactly as consumer would ─
          cat > "$ROOT/.github/workflows/ci.yml" << 'YAML'
          name: Consumer CI

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]

          jobs:
            lint-and-typecheck:
              uses: ./.github/workflows/ci-python.yml
              with:
                python-version: "3.10"
                src-path: src/consumer_pkg
                test-path: tests
                mypy-target: src/consumer_pkg
                coverage-fail-under: 80
                wheel-entry-points: consumer_pkg
            YAML

          echo "Python consumer project created at $ROOT"

      - name: Lint consumer Python workflow
        shell: bash
        env:
          CONSUMER_ROOT: /tmp/consumer-python
        run: |
          WORKFLOW="$CONSUMER_ROOT/.github/workflows/ci.yml"
          if command -v actionlint > /dev/null 2>&1; then
            actionlint "$WORKFLOW"
          else
            # Minimal fallback: check YAML syntax and required fields
            python3 -c "
            import yaml, sys
            with open('$WORKFLOW') as f:
                wf = yaml.safe_load(f)
            jobs = wf.get('jobs', {})
            if not jobs:
                print('FAIL: no jobs in workflow', file=sys.stderr)
                sys.exit(1)
            for name, job in jobs.items():
                if 'uses' not in job and 'steps' not in job:
                    print(f'FAIL: job $name has neither uses nor steps', file=sys.stderr)
                    sys.exit(1)
            print('YAML structure OK (actionlint unavailable)')
            "
          fi

      - name: Audit consumer Python workflow with zizmor
        shell: bash
        env:
          CONSUMER_ROOT: /tmp/consumer-python
        run: |
          WORKFLOW="$CONSUMER_ROOT/.github/workflows/ci.yml"
          if command -v zizmor > /dev/null 2>&1; then
            zizmor --no-online-audits "$WORKFLOW"
          else
            echo "SKIP: zizmor unavailable — security audit skipped"
          fi

      - name: Create TypeScript consumer project
        shell: bash
        env:
          CONSUMER_ROOT: /tmp/consumer-typescript
        run: |
          ROOT="$CONSUMER_ROOT"
          mkdir -p "$ROOT/src"
          mkdir -p "$ROOT/tests"
          mkdir -p "$ROOT/.github/workflows"
          mkdir -p "$ROOT/.github/actions/setup-node-deps"

          # ── package.json ────────────────────────────────────────────────
          cat > "$ROOT/package.json" << 'EOF'
          {
            "name": "consumer-typescript",
            "version": "0.1.0",
            "type": "commonjs",
            "scripts": {
              "lint": "echo 'lint: pass'",
              "format:check": "echo 'format:check: pass'",
              "typecheck": "tsc --noEmit",
              "test": "echo 'test: pass'"
            },
            "devDependencies": {
              "typescript": "^5.0.0",
              "@types/node": "^20.0.0"
            }
          }
          EOF

          # ── tsconfig.json ───────────────────────────────────────────────
          cat > "$ROOT/tsconfig.json" << 'EOF'
          {
            "compilerOptions": {
              "target": "ES2020",
              "module": "commonjs",
              "strict": true,
              "esModuleInterop": true,
              "skipLibCheck": true,
              "forceConsistentCasingInFileNames": true
            },
            "include": ["src", "tests"]
          }
          EOF

          # ── src/index.ts ───────────────────────────────────────────────
          cat > "$ROOT/src/index.ts" << 'EOF'
          export const greet = (name: string): string => `Hello, ${name}`;
          EOF

          # ── tests/test.ts ──────────────────────────────────────────────
          cat > "$ROOT/tests/test.ts" << 'EOF'
          import { greet } from "../src/index";

          describe("greet", () => {
            it("returns greeting", () => {
              const result = greet("world");
              if (result !== "Hello, world") {
                throw new Error("expected 'Hello, world'");
              }
            });
          });
          EOF

          # ── Copy reusable workflow + action ───────────────────────────
          cp .github/workflows/ci-typescript.yml "$ROOT/.github/workflows/ci-typescript.yml"
          cp .github/actions/setup-node-deps/action.yml \
             "$ROOT/.github/actions/setup-node-deps/action.yml"

          # ── Consumer ci.yml ─────────────────────────────────────────────
          cat > "$ROOT/.github/workflows/ci.yml" << 'YAML'
          name: Consumer CI

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]

          jobs:
            typecheck-and-test:
              uses: ./.github/workflows/ci-typescript.yml
              with:
                node-version: "20"
                package-manager: "npm"
                lint-script: "lint"
                format-script: "format:check"
                typecheck-script: "typecheck"
                test-script: "test"
                build-script: "build"
            YAML

          echo "TypeScript consumer project created at $ROOT"

      - name: Lint consumer TypeScript workflow
        shell: bash
        env:
          CONSUMER_ROOT: /tmp/consumer-typescript
        run: |
          WORKFLOW="$CONSUMER_ROOT/.github/workflows/ci.yml"
          if command -v actionlint > /dev/null 2>&1; then
            actionlint "$WORKFLOW"
          else
            python3 -c "
            import yaml, sys
            with open('$WORKFLOW') as f:
                wf = yaml.safe_load(f)
            jobs = wf.get('jobs', {})
            if not jobs:
                print('FAIL: no jobs in workflow', file=sys.stderr)
                sys.exit(1)
            for name, job in jobs.items():
                if 'uses' not in job and 'steps' not in job:
                    print(f'FAIL: job $name has neither uses nor steps', file=sys.stderr)
                    sys.exit(1)
            print('YAML structure OK (actionlint unavailable)')
            "
          fi

      - name: Audit consumer TypeScript workflow with zizmor
        shell: bash
        env:
          CONSUMER_ROOT: /tmp/consumer-typescript
        run: |
          WORKFLOW="$CONSUMER_ROOT/.github/workflows/ci.yml"
          if command -v zizmor > /dev/null 2>&1; then
            zizmor --no-online-audits "$WORKFLOW"
          else
            echo "SKIP: zizmor unavailable — security audit skipped"
          fi
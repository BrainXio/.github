name: Self CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-runners:
    name: Validate Runner OS
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Verify OS version
        shell: bash
        run: |
          expected="${{ matrix.os }}"
          actual=$(. /etc/os-release && echo "${ID}-${VERSION_ID}")
          if [ "$expected" != "$actual" ]; then
            echo "ERROR: expected $expected, got $actual"
            exit 1
          fi
          echo "OS verified: $actual"

      - name: Print runner info
        shell: bash
        run: 'echo "Runner OK: $(uname -a)"'

  validate-workflows:
    name: Validate Workflow Syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install PyYAML
        shell: bash
        run: pip install pyyaml 2>/dev/null || python3 -m pip install pyyaml

      - name: YAML syntax check
        shell: bash
        run: |
          python3 -c "
          import sys, yaml, glob
          errors = []
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              if 'self-ci.yml' in f:
                  continue
              try:
                  with open(f) as fh:
                      yaml.safe_load(fh)
              except Exception as e:
                  errors.append(f'{f}: {e}')
          if errors:
              for e in errors:
                  print(f'FAIL: {e}', file=sys.stderr)
              sys.exit(1)
          print('All workflow files valid')
          "

      - name: Enforce absolute action references (no relative paths)
        run: |
          ! grep -rE 'uses: \./\.github/actions/' .github/workflows/ || \
          (echo "FAIL: Relative ./.github/actions/ paths found in self-CI workflows" && exit 1)

      - name: Enforce no deprecated actions/cache@v[0-3]
        run: |
          ! grep -rE 'actions/cache@v[0-3]' . || \
          (echo "FAIL: Deprecated actions/cache@v[0-3] detected — must use @v4" && exit 1)

  validate-templates:
    name: Validate Issue Templates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Check issue template files exist
        shell: bash
        run: |
          for f in ISSUE_TEMPLATE/bug_report.md ISSUE_TEMPLATE/feature_request.md; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Missing $f" >&2
              exit 1
            fi
          done
          echo "Issue templates present"

  validate-defaults:
    name: Validate Default Configs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Check default config files are valid YAML/JSON
        shell: bash
        run: |
          python3 -c "
          import yaml, json, sys, glob
          errors = []
          for f in sorted(glob.glob('defaults/*')):
              if f.endswith('.toml'):
                  continue
              try:
                  if f.endswith('.json'):
                      with open(f) as fh:
                          json.load(fh)
                  else:
                      with open(f) as fh:
                          yaml.safe_load(fh)
              except Exception as e:
                  errors.append(f'{f}: {e}')
          if errors:
              for e in errors:
                  print(f'FAIL: {e}', file=sys.stderr)
              sys.exit(1)
          print('All default configs valid')
          "

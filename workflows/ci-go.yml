name: Go CI
# === Consumer reusable workflow ===
# Always call via: uses: brainxio/.github/workflows/ci-go.yml@v1
# Do NOT copy the file unless you intend to fork.

on:
  workflow_call:
    inputs:
      go-version:
        description: "Go version"
        type: string
        default: "1.22"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Node 20→24 migration, remove Q3 2026

permissions:
  contents: read

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: brainxio/.github/actions/setup-go-deps@v1
        with:
          go-version: ${{ inputs.go-version }}

      - name: Check formatting
        shell: bash
        run: |
          diff=$(gofmt -d .)
          if [ -n "$diff" ]; then
            echo "$diff"
            echo "ERROR: gofmt found formatting issues"
            exit 1
          fi

  vet:
    name: Go Vet
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: brainxio/.github/actions/setup-go-deps@v1
        with:
          go-version: ${{ inputs.go-version }}

      - run: go vet ./...

  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: brainxio/.github/actions/setup-go-deps@v1
        with:
          go-version: ${{ inputs.go-version }}

      - run: go test -race -coverprofile=coverage.out ./...

  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: brainxio/.github/actions/setup-go-deps@v1
        with:
          go-version: ${{ inputs.go-version }}

      - run: go build ./...

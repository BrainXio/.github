name: TypeScript CI

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version"
        type: string
        default: "20"
      package-manager:
        description: "Package manager: npm, pnpm, or yarn"
        type: string
        default: "npm"
      lint-script:
        description: "package.json lint script name"
        type: string
        default: "lint"
      format-script:
        description: "package.json format check script name"
        type: string
        default: "format:check"
      typecheck-script:
        description: "package.json typecheck script name"
        type: string
        default: "typecheck"
      test-script:
        description: "package.json test script name"
        type: string
        default: "test"
      build-script:
        description: "package.json build script name"
        type: string
        default: "build"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Node 20→24 migration, remove Q3 2026 — see docs/node24-migration.md

permissions:
  contents: read

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ inputs.node-version }}
          package-manager: ${{ inputs.package-manager }}
          script: ${{ inputs.lint-script }}

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ inputs.node-version }}
          package-manager: ${{ inputs.package-manager }}
          script: ${{ inputs.format-script }}

  typecheck:
    name: Type Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ inputs.node-version }}
          package-manager: ${{ inputs.package-manager }}
          script: ${{ inputs.typecheck-script }}

  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ inputs.node-version }}
          package-manager: ${{ inputs.package-manager }}
          script: ${{ inputs.test-script }}

  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-deps
        with:
          node-version: ${{ inputs.node-version }}
          package-manager: ${{ inputs.package-manager }}
          script: ${{ inputs.build-script }}
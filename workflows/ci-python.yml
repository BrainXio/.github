name: Python CI

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version"
        type: string
        default: "3.10"
      src-path:
        description: "Source directory path"
        type: string
        default: "src"
      test-path:
        description: "Test directory path"
        type: string
        default: "tests"
      mypy-target:
        description: "Package for mypy (empty = auto-detect from src-path)"
        type: string
        default: ""
      coverage-fail-under:
        description: "Minimum coverage percentage"
        type: number
        default: 80
      coverage-source:
        description: "Coverage source path (empty = auto-detect from src-path)"
        type: string
        default: ""
      run-mcp-integration:
        description: "Run MCP integration tests"
        type: boolean
        default: false
      mcp-test-path:
        description: "Path for MCP integration tests"
        type: string
        default: "tests/mcp"
      mcp-env-vars:
        description: "Extra env vars for MCP tests (KEY=VALUE per line)"
        type: string
        default: ""
      extra-deps:
        description: "Extra uv sync dependency groups (comma-separated, alphanumeric/dash/underscore only)"
        type: string
        default: ""
      wheel-entry-points:
        description: "Expected entry point names in wheel (space-separated, empty skips check)"
        type: string
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Node 20→24 migration, remove Q3 2026

permissions:
  contents: read

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: brainxio/.github/actions/setup-python-deps@v1.0.0
        with:
          python-version: ${{ inputs.python-version }}
          extra-deps: ${{ inputs.extra-deps }}

      - name: Validate paths
        shell: bash
        env:
          SRC_PATH: ${{ inputs.src-path }}
          TEST_PATH: ${{ inputs.test-path }}
        run: |
          [[ "$SRC_PATH" =~ ^[a-zA-Z0-9_/.-]+$ ]] || { echo "ERROR: invalid src-path" >&2; exit 1; }
          [[ "$TEST_PATH" =~ ^[a-zA-Z0-9_/.-]+$ ]] || { echo "ERROR: invalid test-path" >&2; exit 1; }
          echo "SRC_PATH=$SRC_PATH" >> "$GITHUB_ENV"
          echo "TEST_PATH=$TEST_PATH" >> "$GITHUB_ENV"

      - name: Run ruff check
        shell: bash
        run: uv run ruff check "$SRC_PATH"/ "$TEST_PATH"/

      - name: Run ruff format check
        shell: bash
        run: uv run ruff format --check "$SRC_PATH"/ "$TEST_PATH"/

  typecheck:
    name: Type Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: brainxio/.github/actions/setup-python-deps@v1.0.0
        with:
          python-version: ${{ inputs.python-version }}
          extra-deps: ${{ inputs.extra-deps }}

      # -------------------------------------------------------------------------
      # Determine mypy target
      # -------------------------------------------------------------------------
      # Contract:
      #   1. MYPY_TARGET_INPUT set  → validate regex, use directly.
      #   2. SRC_PATH="src" exists  → auto-detect single package under src/;
      #      fail if 0 or 2+ packages found (ambiguous).
      #   3. Custom SRC_PATH        → use SRC_PATH as-is (do NOT append basename).
      # -------------------------------------------------------------------------
      - name: Determine mypy target
        id: mypy-target
        shell: bash
        env:
          MYPY_TARGET_INPUT: ${{ inputs.mypy-target }}
          SRC_PATH: ${{ inputs.src-path }}
        run: |
          if [ -n "$MYPY_TARGET_INPUT" ]; then
            if [[ ! "$MYPY_TARGET_INPUT" =~ ^[a-zA-Z0-9_/.-]+$ ]]; then
              echo "ERROR: mypy-target input contains invalid characters: $MYPY_TARGET_INPUT" >&2
              exit 1
            fi
            echo "target=$MYPY_TARGET_INPUT" >> "$GITHUB_OUTPUT"
          elif [ "$SRC_PATH" = "src" ] && [ -d "src" ]; then
            # Count packages under src/ (directories with __init__.py at depth 2)
            count=$(find src/ -maxdepth 2 -name "__init__.py" -exec dirname {} \; 2>/dev/null | sort -u | wc -l)
            if [ "$count" -eq 1 ]; then
              pkg=$(find src/ -maxdepth 2 -name "__init__.py" -exec dirname {} \; 2>/dev/null | sort -u | head -1 | sed 's|^src/||' | tr '-' '_')
              echo "target=src/$pkg" >> "$GITHUB_OUTPUT"
            else
              echo "Cannot auto-detect mypy target: found $count packages under src/. Set mypy-target input explicitly." >&2
              exit 1
            fi
          else
            # Custom SRC_PATH — use it directly as the mypy target path
            echo "target=$SRC_PATH" >> "$GITHUB_OUTPUT"
          fi

      - name: Run mypy
        shell: bash
        env:
          MYPY_TARGET: ${{ steps.mypy-target.outputs.target }}
        run: uv run mypy "$MYPY_TARGET" --strict

  test:
    name: Test and Coverage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: brainxio/.github/actions/setup-python-deps@v1.0.0
        with:
          python-version: ${{ inputs.python-version }}
          extra-deps: ${{ inputs.extra-deps }}

      - name: Run tests with coverage
        shell: bash
        env:
          COVERAGE_SOURCE: ${{ inputs.coverage-source }}
          COVERAGE_FAIL_UNDER: ${{ inputs.coverage-fail-under }}
        run: |
          if [ -n "$COVERAGE_SOURCE" ]; then
            uv run pytest --cov="$COVERAGE_SOURCE" --cov-report=term-missing --cov-fail-under="$COVERAGE_FAIL_UNDER" -q
          else
            uv run pytest --cov --cov-report=term-missing --cov-fail-under="$COVERAGE_FAIL_UNDER" -q
          fi

  build-verify:
    name: Build Verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: brainxio/.github/actions/setup-python-deps@v1.0.0
        with:
          python-version: ${{ inputs.python-version }}
          extra-deps: ${{ inputs.extra-deps }}

      - run: uv run python -m build

      - name: Verify wheel entry points
        if: ${{ inputs.wheel-entry-points != '' }}
        shell: bash
        env:
          ENTRY_POINTS: ${{ inputs.wheel-entry-points }}
        run: |
          python3 -c "
          import configparser, glob, os, sys, zipfile

          entry_points = os.environ['ENTRY_POINTS'].split()
          if not entry_points:
              print('ERROR: no entry point names provided')
              sys.exit(1)

          wheel_dir = 'dist'
          wheels = sorted(glob.glob(os.path.join(wheel_dir, '*.whl')))
          if not wheels:
              print(f'ERROR: no .whl found in {wheel_dir}/')
              sys.exit(1)

          wheel = wheels[-1]
          with zipfile.ZipFile(wheel) as z:
              ep_path = next(
                  (n for n in z.namelist() if n.endswith('.dist-info/entry_points.txt')),
                  None
              )
              if not ep_path:
                  print(f'ERROR: no entry_points.txt in {wheel}')
                  sys.exit(1)
              ep_content = z.read(ep_path).decode('utf-8')

          cp = configparser.ConfigParser()
          cp.read_string(ep_content)
          found = set()
          for section in cp.sections():
              found.update(cp.options(section))

          missing = [ep for ep in entry_points if ep not in found]
          if missing:
              print(f'ERROR: missing entry points in {wheel}: {missing}')
              print(f'Found: {sorted(found)}')
              sys.exit(1)

          print(f'Verified {len(entry_points)} entry point(s) in {os.path.basename(wheel)}')
          "

  mcp-integration:
    name: MCP Server Integration
    if: ${{ inputs.run-mcp-integration }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: brainxio/.github/actions/setup-python-deps@v1.0.0
        with:
          python-version: ${{ inputs.python-version }}
          extra-deps: ${{ inputs.extra-deps }}

      - name: Run MCP integration tests
        shell: bash
        env:
          MCP_ENV_VARS: ${{ inputs.mcp-env-vars }}
          MCP_TEST_PATH: ${{ inputs.mcp-test-path }}
        run: |
          if [ -n "$MCP_ENV_VARS" ]; then
            while IFS='=' read -r key value; do
              # Trim whitespace — pure bash, no xargs
              key="${key#"${key%%[![:space:]]*}"}"
              key="${key%"${key##*[![:space:]]}"}"
              if [[ ! "$key" =~ ^[a-zA-Z_][a-zA-Z0-9_]*$ ]]; then
                echo "ERROR: invalid env var name: $key" >&2
                exit 1
              fi
              export "$key=$value"
            done <<< "$MCP_ENV_VARS"
          fi
          [[ "$MCP_TEST_PATH" =~ ^[a-zA-Z0-9_/.-]+$ ]] || { echo "ERROR: invalid test path" >&2; exit 1; }
          uv run pytest "$MCP_TEST_PATH"/ -v
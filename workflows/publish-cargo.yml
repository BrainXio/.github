name: Publish Crate

on:
  workflow_call:
    inputs:
      registry:
        description: "Cargo registry name"
        type: string
        default: "crates-io"
      toolchain:
        description: "Rust toolchain version"
        type: string
        default: "1.87.0"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Node 20→24 migration, remove Q3 2026

permissions:
  contents: read

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: ${{ inputs.toolchain }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Publish crate
        # zizmor: ignore[use-trusted-publishing] — cargo publish requires registry token; trusted publishing not supported by crates.io
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CARGO_REGISTRY: ${{ inputs.registry }}
        run: cargo publish --registry "$CARGO_REGISTRY"
name: Publish npm Package
# === Consumer reusable workflow ===
# Always call via: uses: brainxio/.github/workflows/publish-npm.yml@v1
# Do NOT copy the file unless you intend to fork.

on:
  workflow_call:
    inputs:
      registry-url:
        description: "npm registry URL"
        type: string
        default: "https://npm.pkg.github.com"
      scope:
        description: "npm scope"
        type: string
        default: "@brainxio"
      node-version:
        description: "Node.js version"
        type: string
        default: "20"
      package-manager:
        description: "Package manager: npm, pnpm, or yarn"
        type: string
        default: "npm"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Node 20→24 migration, remove Q3 2026

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: brainxio/.github/actions/setup-node-deps@v1
        with:
          node-version: ${{ inputs.node-version }}
          package-manager: ${{ inputs.package-manager }}
          registry-url: ${{ inputs.registry-url }}
          scope: ${{ inputs.scope }}

      - run: npm run build

      - run: npm publish  # zizmor: ignore[use-trusted-publishing] — GitHub Packages npm registry requires NODE_AUTH_TOKEN; trusted publishing via OIDC not supported
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
